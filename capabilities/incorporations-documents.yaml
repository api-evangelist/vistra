naftiko: 1.0.0-alpha2
info:
  label: Vistra Incorporations API — Documents
  description: 'Vistra Incorporations API — Documents. 2 operations. Lead operation: Generate Document Upload URL. Self-contained
    Naftiko capability covering one Vistra business surface.'
  tags:
  - Vistra
  - Documents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VISTRA_API_KEY: VISTRA_API_KEY
capability:
  consumes:
  - type: http
    namespace: incorporations-documents
    baseUri: https://api.vistra.com
    description: Vistra Incorporations API — Documents business capability. Self-contained, no shared references.
    resources:
    - name: v1-external-documents-upload-url
      path: /v1/external/documents/upload-url
      operations:
      - name: generatedocumentuploadurl
        method: POST
        description: Generate Document Upload URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-external-documents-id-upload-complete
      path: /v1/external/documents/{id}/upload-complete
      operations:
      - name: completedocumentupload
        method: POST
        description: Complete Document Upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The document ID returned by the generate-upload-url endpoint
          required: true
    authentication:
      type: bearer
      token: '{{env.VISTRA_API_KEY}}'
  exposes:
  - type: rest
    namespace: incorporations-documents-rest
    port: 8080
    description: REST adapter for Vistra Incorporations API — Documents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/external/documents/upload-url
      name: v1-external-documents-upload-url
      description: REST surface for v1-external-documents-upload-url.
      operations:
      - method: POST
        name: generatedocumentuploadurl
        description: Generate Document Upload URL
        call: incorporations-documents.generatedocumentuploadurl
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/external/documents/{id}/upload-complete
      name: v1-external-documents-id-upload-complete
      description: REST surface for v1-external-documents-id-upload-complete.
      operations:
      - method: POST
        name: completedocumentupload
        description: Complete Document Upload
        call: incorporations-documents.completedocumentupload
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: incorporations-documents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vistra Incorporations API — Documents. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: generate-document-upload-url
      description: Generate Document Upload URL
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: incorporations-documents.generatedocumentuploadurl
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: complete-document-upload
      description: Complete Document Upload
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: incorporations-documents.completedocumentupload
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
