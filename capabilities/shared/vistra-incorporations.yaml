naftiko: "1.0.0-alpha1"

info:
  label: "Vistra Incorporations API"
  description: >-
    Shared capability definition for the Vistra Incorporations API.
    Enables programmatic company incorporation in supported jurisdictions (BVI),
    including document upload URL generation, upload completion notification,
    and full incorporation request submission.
  tags:
    - BVI
    - Compliance
    - Corporate Services
    - Entity Management
    - Incorporation
    - Legal
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      VISTRA_ACCESS_TOKEN: VISTRA_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: vistra-incorporations
      baseUri: https://api.vistra.com
      description: "Vistra Incorporations REST API for BVI entity formation"
      authentication:
        type: bearer
        token: "{{VISTRA_ACCESS_TOKEN}}"
      resources:
        - name: document-upload-url
          path: /v1/external/documents/upload-url
          description: "Pre-signed document upload URL generation"
          operations:
            - name: generate-document-upload-url
              method: POST
              description: "Generate a pre-signed S3 URL for document upload"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  filename: "{{tools.filename}}"
                  contentType: "{{tools.contentType}}"
                  description: "{{tools.description}}"
        - name: document-upload-complete
          path: /v1/external/documents/{id}/upload-complete
          description: "Document upload completion notification"
          operations:
            - name: complete-document-upload
              method: POST
              description: "Notify Vistra that a document upload has completed"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Document ID from generate-upload-url"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: incorporations
          path: /v1/external/incorporations
          description: "Incorporation request management"
          operations:
            - name: create-incorporation
              method: POST
              description: "Submit a company incorporation request"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  jurisdiction: "{{tools.jurisdiction}}"
                  companyName: "{{tools.companyName}}"
                  entityType: "{{tools.entityType}}"
                  documentIds: "{{tools.documentIds}}"
            - name: list-incorporations
              method: GET
              description: "List submitted incorporation requests"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status"
                - name: offset
                  in: query
                  type: integer
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: incorporation
          path: /v1/external/incorporations/{id}
          description: "Individual incorporation lookup"
          operations:
            - name: get-incorporation
              method: GET
              description: "Get status and details of a specific incorporation"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Incorporation request ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: vistra-incorporations-rest
      resources:
        - path: /v1/incorporations
          name: incorporations
          description: "Incorporation requests"
          operations:
            - method: GET
              name: list-incorporations
              description: "List incorporations"
              call: "vistra-incorporations.list-incorporations"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-incorporation
              description: "Submit incorporation request"
              call: "vistra-incorporations.create-incorporation"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/documents/upload-url
          name: document-upload-url
          description: "Document upload URL"
          operations:
            - method: POST
              name: generate-document-upload-url
              description: "Generate upload URL"
              call: "vistra-incorporations.generate-document-upload-url"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: vistra-incorporations-mcp
      transport: http
      tools:
        - name: generate-document-upload-url
          description: "Generate a pre-signed S3 URL for uploading an incorporation document"
          hints:
            readOnly: false
            idempotent: false
          call: "vistra-incorporations.generate-document-upload-url"
          with:
            filename: "tools.filename"
            contentType: "tools.contentType"
          outputParameters:
            - type: object
              mapping: "$."
        - name: complete-document-upload
          description: "Notify Vistra that a document upload has completed"
          hints:
            readOnly: false
            idempotent: true
          call: "vistra-incorporations.complete-document-upload"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-incorporation
          description: "Submit a company incorporation request to Vistra"
          hints:
            readOnly: false
            idempotent: false
          call: "vistra-incorporations.create-incorporation"
          with:
            jurisdiction: "tools.jurisdiction"
            companyName: "tools.companyName"
            entityType: "tools.entityType"
            documentIds: "tools.documentIds"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-incorporations
          description: "List submitted incorporation requests and their status"
          hints:
            readOnly: true
            idempotent: true
          call: "vistra-incorporations.list-incorporations"
          with:
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-incorporation
          description: "Get status and details of a specific incorporation request"
          hints:
            readOnly: true
            idempotent: true
          call: "vistra-incorporations.get-incorporation"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
