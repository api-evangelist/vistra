description: Vistra Corp is an integrated retail electricity and power-generation company (TXU
  Energy, Dynegy, Homefield, etc.). It does not publish a developer API or self-service pricing;
  retail electricity rates are sold through the consumer-facing brand sites and wholesale power is
  transacted via market mechanisms, not via a published API.
