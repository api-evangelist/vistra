aid: vistra
name: Vistra
description: >-
  Vistra is a global corporate services provider operating in over 45 jurisdictions, offering entity management,
  incorporation, compliance, payroll, and fund administration services. The Vistra REST API enables developers to
  programmatically submit company incorporation requests in supported jurisdictions (initially British Virgin Islands),
  upload supporting documents to pre-signed storage URLs, and integrate Vistra's corporate services into business
  process workflows. Authentication uses OAuth2 bearer tokens obtained through the Vistra Developer Portal.
