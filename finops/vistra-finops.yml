principles:
  - name: Visibility
    description: Visibility is provided by the smart-meter / utility billing data feed and the
      retail brand's customer portal (TXU, Homefield, etc.); there is no developer billing API.
  - name: Allocation
    description: Allocate spend by service-address / facility against the consuming business unit.
  - name: Optimization
    description: Optimization levers are commercial - rate-plan selection, demand-response
      participation, on-site generation / storage, and contract term negotiation.
  - name: Accountability
    description: Facilities / energy management owns electricity spend; finance reconciles against
      monthly utility statements.
