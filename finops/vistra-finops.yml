description: Vistra Corp is an integrated electricity retailer and generator. The FinOps surface
  is electricity supply (kWh delivered, capacity, transmission) rather than metered API
  consumption; this artifact is a Contact Sales placeholder and should not be confused with cloud-
  service FinOps.
